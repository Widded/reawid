<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 1100" width="800" height="1100">
  <defs>
    <!-- Paper texture & gradients -->
    <linearGradient id="paperGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fbf7ee" />
      <stop offset="50%" stop-color="#f5efe0" />
      <stop offset="100%" stop-color="#ede4cf" />
    </linearGradient>

    <!-- Book spine / gutter shadow -->
    <linearGradient id="spineShadow" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="rgba(40, 30, 20, 0.18)" />
      <stop offset="3%" stop-color="rgba(40, 30, 20, 0.08)" />
      <stop offset="10%" stop-color="rgba(40, 30, 20, 0.02)" />
      <stop offset="100%" stop-color="rgba(40, 30, 20, 0)" />
    </linearGradient>

    <!-- Paper edges shadow -->
    <linearGradient id="edgeShadow" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="rgba(0, 0, 0, 0.04)" />
      <stop offset="98%" stop-color="rgba(0, 0, 0, 0.02)" />
      <stop offset="100%" stop-color="rgba(0, 0, 0, 0.08)" />
    </linearGradient>

    <!-- Noise filter for paper grain -->
    <filter id="paperGrain" x="0%" y="0%" width="100%" height="100%">
      <feTurbulence type="fractalNoise" baseFrequency="0.04" numOctaves="4" result="noise" />
      <feColorMatrix type="matrix" values="0 0 0 0 0.15   0 0 0 0 0.12   0 0 0 0 0.08  0 0 0 0.05 0" />
      <feComposite in2="SourceGraphic" in="glitch" operator="arithmetic" k1="0" k2="1" k3="1" k4="0" />
    </filter>
  </defs>

  <!-- Base Page Background -->
  <rect width="800" height="1100" fill="url(#paperGrad)" />
  <rect width="800" height="1100" fill="url(#edgeShadow)" />
  <rect width="40" height="1100" fill="url(#spineShadow)" />

  <!-- Running Header -->
  <text x="400" y="70" font-family="'Lora', 'Georgia', 'Times New Roman', serif" font-size="13" font-style="italic" fill="#5c5346" text-anchor="middle" letter-spacing="2">LEV TOLSTOY</text>
  <line x1="120" y1="84" x2="680" y2="84" stroke="#d5cabb" stroke-width="0.8" />

  <!-- Chapter Heading -->
  <text x="400" y="170" font-family="'Plus Jakarta Sans', -apple-system, sans-serif" font-size="13" font-weight="600" fill="#756b5d" text-anchor="middle" letter-spacing="4">BÖLÜM 1</text>
  <text x="400" y="224" font-family="'Lora', 'Georgia', 'Times New Roman', serif" font-size="34" font-weight="bold" fill="#241e17" text-anchor="middle" letter-spacing="-0.5">İnsan Ne ile Yaşar?</text>
  
  <line x1="360" y1="248" x2="440" y2="248" stroke="#a39683" stroke-width="1.2" />

  <!-- Paragraph 1 -->
  <g font-family="'Lora', 'Georgia', 'Times New Roman', serif" font-size="20.5" fill="#28221a" text-rendering="geometricPrecision">
    <text x="120" y="320">
      <tspan font-size="52" font-weight="bold" fill="#1f1811" dy="10">İ</tspan><tspan font-size="20.5" dy="-10">nsan, yalnızca ekmekle değil, aynı zamanda</tspan>
    </text>
    <text x="120" y="360">sevgi, umut ve anlamla da yaşar. Hayatın gerçek değeri,</text>
    <text x="120" y="398">insanın kalbinde taşıdığı iyiliktedir.</text>

    <!-- Paragraph 2 -->
    <text x="150" y="470">Bazen en küçük bir iyilik, bir insanın tüm hayatını</text>
    <text x="120" y="508">değiştirebilir. Çünkü insan, ancak başkaları için bir</text>
    <text x="120" y="546">şeyler yaptığında gerçek anlamda var olur.</text>

    <!-- Paragraph 3 -->
    <text x="150" y="618">İyilik, farkında olmadan da olsa bir ışık gibi yayılır</text>
    <text x="120" y="656">ve bir gün mutlaka karşılık bulur. Bu yüzden, insan</text>
    <text x="120" y="694">yalnızca kendisi için değil, çevresindeki herkes için de</text>
    <text x="120" y="732">yaşamalıdır.</text>

    <!-- Paragraph 4 (Continuing Russian classic passage) -->
    <text x="150" y="804">Simon kunduracı kulübesine doğru ağır adımlarla</text>
    <text x="120" y="842">yürürken, içindeki ses ona merhametin kapılarını ardına</text>
    <text x="120" y="880">kadar açmasını söylüyordu. Soğuk rüzgâr dalları</text>
    <text x="120" y="918">savururken, insanın içindeki ateş hiç sönmeyecekti.</text>
  </g>

  <!-- Page Number Footer -->
  <line x1="120" y1="990" x2="680" y2="990" stroke="#d5cabb" stroke-width="0.8" />
  <text x="400" y="1030" font-family="'Lora', 'Georgia', serif" font-size="16" fill="#695f50" text-anchor="middle">3</text>
</svg>
